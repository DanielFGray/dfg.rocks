services:
  app:
    build: .
    ports:
      - "3001:3001"
    env_file: ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: "3001"
      VITE_ROOT_URL: http://localhost
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_URL: postgres://${DATABASE_OWNER}:${DATABASE_OWNER_PASSWORD}@db:5432/${DATABASE_NAME}
      AUTH_DATABASE_URL: postgres://${DATABASE_AUTHENTICATOR}:${DATABASE_AUTHENTICATOR_PASSWORD}@db:5432/${DATABASE_NAME}
      ROOT_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${ROOT_DATABASE_PASSWORD}@db:5432/template1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${ROOT_DATABASE_PASSWORD:?Set ROOT_DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    command: ["bun", "run", "worker"]
    env_file: ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_URL: postgres://${DATABASE_OWNER}:${DATABASE_OWNER_PASSWORD}@db:5432/${DATABASE_NAME}
      AUTH_DATABASE_URL: postgres://${DATABASE_AUTHENTICATOR}:${DATABASE_AUTHENTICATOR_PASSWORD}@db:5432/${DATABASE_NAME}
      ROOT_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${ROOT_DATABASE_PASSWORD}@db:5432/template1
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist/client:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
