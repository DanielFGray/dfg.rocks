services:
  db:
    image: postgres:18-alpine
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${ROOT_DATABASE_PASSWORD:?ROOT_DATABASE_PASSWORD}
    volumes:
      - pg18data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg18data:
